<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4e73df,#224abe);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
}

.container{
    width:850px;
    background:white;
    border-radius:15px;
    box-shadow:0px 8px 25px rgba(0,0,0,0.3);
    padding:35px;
}

h1{
    text-align:center;
    color:#224abe;
    margin-bottom:30px;
}

fieldset{
    border:2px solid #4e73df;
    border-radius:10px;
    padding:20px;
    margin-bottom:25px;
}

legend{
    color:#224abe;
    font-size:20px;
    font-weight:bold;
    padding:0 10px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#333;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    transition:0.3s;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#224abe;
    box-shadow:0 0 8px rgba(34,75,190,.4);
}

.gender{
    display:flex;
    gap:25px;
    margin-top:10px;
}

.gender label{
    font-weight:normal;
}

.skills{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:10px;
}

.skills label{
    font-weight:normal;
}

textarea{
    resize:vertical;
}

button{
    width:100%;
    padding:15px;
    background:#224abe;
    color:white;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#466ee6;
    transform:scale(1.02);
}

</style>
</head>

<body>

<div class="container">

<h1>Student Registration Form</h1>

<form>

<!-- Personal Information -->

<fieldset>

<legend>Personal Information</legend>

<div class="form-group">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" placeholder="example@gmail.com" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" placeholder="Create Password" required>
</div>

<div class="form-group">
<label>Mobile Number</label>
<input type="tel"
placeholder="000000000"
pattern="[0-9]{10}"
required>
</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" required>
</div>

<div class="form-group">

<label>Gender</label>

<div class="gender">

<label><input type="radio" name="gender" required> Male</label>

<label><input type="radio" name="gender"> Female</label>

<label><input type="radio" name="gender"> Other</label>

</div>

</div>

</fieldset>

<!-- Academic Information -->

<fieldset>

<legend>Academic Information</legend>

<div class="form-group">

<label>Select Course</label>

<select required>

<option value="">-- Select Course --</option>

<option>B.Tech Computer Science Engineering</option>

<option>B.Tech Information Technology</option>

<option>B.Tech Artificial Intelligence</option>

<option>B.Tech Mechanical Engineering</option>

<option>B.Tech Civil Engineering</option>

<option>B.Tech Electronics Engineering</option>

</select>

</div>

</fieldset>

<!-- Skills -->

<fieldset>

<legend>Technical Skills</legend>

<div class="skills">

<label><input type="checkbox"> HTML</label>

<label><input type="checkbox"> CSS</label>

<label><input type="checkbox"> PHP</label>

<label><input type="checkbox"> JavaScript</label>

</div>

</fieldset>

<!-- Resume -->

<fieldset>

<legend>Resume Upload</legend>

<div class="form-group">

<label>Choose Resume</label>

<input type="file" required>

</div>

</fieldset>

<!-- About -->

<fieldset>

<legend>About Yourself</legend>

<textarea rows="6"
placeholder="Write something about yourself..."
required></textarea>

</fieldset>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
